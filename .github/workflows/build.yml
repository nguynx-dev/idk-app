name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao project Flutter moi
        run: flutter create --org com.example --project-name app_manager --platforms android build_app

      - name: Chep file nguon vao project
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp main.dart build_app/lib/main.dart
          cp AndroidManifest.xml build_app/android/app/src/main/AndroidManifest.xml
          mkdir -p build_app/android/app/src/main/kotlin/com/example/app_manager
          cp MainActivity.kt build_app/android/app/src/main/kotlin/com/example/app_manager/MainActivity.kt
          rm -rf build_app/test

      - name: Build APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
